<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer & Stopwatch Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        darkBg: '#0F172A',
                        cardBg: 'rgba(30, 41, 59, 0.7)',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
            min-height: 100vh;
            color: #f8fafc;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glow-cyan {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.3);
        }

        .glow-alarm {
            animation: alarmGlow 0.8s infinite alternate;
        }

        @keyframes alarmGlow {
            0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); border-color: rgba(239, 68, 68, 0.5); }
            100% { box-shadow: 0 0 35px rgba(239, 68, 68, 0.9); border-color: rgba(239, 68, 68, 1); }
        }

        /* Hide HTML5 Spinner for Number Inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.5);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.8);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 font-sans select-none antialiased min-h-screen">

    <div class="w-full max-w-lg glass-panel rounded-3xl p-6 md:p-8 shadow-2xl relative overflow-hidden my-auto transition-all duration-300" id="mainContainer">
        
        <!-- Tab Navigation -->
        <div class="flex bg-slate-900/60 p-1.5 rounded-2xl mb-8 border border-white/5 relative">
            <button id="tabTimer" onclick="switchTab('timer')" class="flex-1 py-3 rounded-xl font-medium text-sm md:text-base flex items-center justify-center gap-2 transition-all duration-300 text-cyan-400 bg-slate-800/80 shadow-md">
                <i class="fa-solid font-bold fa-hourglass-half"></i> 倒數計時器
            </button>
            <button id="tabStopwatch" onclick="switchTab('stopwatch')" class="flex-1 py-3 rounded-xl font-medium text-sm md:text-base flex items-center justify-center gap-2 transition-all duration-300 text-slate-400 hover:text-slate-200">
                <i class="fa-solid fa-stopwatch"></i> 碼表
            </button>
        </div>

        <!-- ==================== COUNTDOWN TIMER SECTION ==================== -->
        <div id="sectionTimer" class="space-y-6">
            
            <!-- Circular Progress Bar & Display -->
            <div class="relative w-64 h-64 md:w-72 md:h-72 mx-auto flex items-center justify-center">
                <!-- SVG Circle Progress -->
                <svg class="w-full h-full transform -rotate-90">
                    <circle cx="50%" cy="50%" r="42%" class="stroke-slate-800" stroke-width="12" fill="transparent" />
                    <circle id="timerProgressRing" cx="50%" cy="50%" r="42%" class="stroke-cyan-500 transition-all duration-300" stroke-width="12" stroke-dasharray="710" stroke-dashoffset="0" stroke-linecap="round" fill="transparent" />
                </svg>

                <!-- Center Display Text -->
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                    <div id="timerDisplay" class="font-mono text-4xl md:text-5xl font-bold tracking-tight text-white mb-1">
                        00:00:00
                    </div>
                    <div id="timerPercentDisplay" class="text-xs md:text-sm font-semibold tracking-wider text-cyan-400/90 bg-cyan-950/40 px-3 py-1 rounded-full border border-cyan-500/20 font-mono">
                        100.000% 剩餘
                    </div>
                </div>
            </div>

            <!-- Quick Add Time Buttons -->
            <div class="grid grid-cols-3 gap-2">
                <button onclick="addMinutes(1)" class="py-2 px-3 rounded-xl bg-slate-800/60 hover:bg-slate-700/60 border border-white/5 text-slate-300 text-xs md:text-sm font-medium hover:text-cyan-400 transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-plus text-xs"></i> 1 分鐘
                </button>
                <button onclick="addMinutes(5)" class="py-2 px-3 rounded-xl bg-slate-800/60 hover:bg-slate-700/60 border border-white/5 text-slate-300 text-xs md:text-sm font-medium hover:text-cyan-400 transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-plus text-xs"></i> 5 分鐘
                </button>
                <button onclick="addMinutes(10)" class="py-2 px-3 rounded-xl bg-slate-800/60 hover:bg-slate-700/60 border border-white/5 text-slate-300 text-xs md:text-sm font-medium hover:text-cyan-400 transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-plus text-xs"></i> 10 分鐘
                </button>
            </div>

            <!-- Time Inputs (Hours, Minutes, Seconds) -->
            <div id="timerInputGroup" class="grid grid-cols-3 gap-3 pt-2">
                <div class="flex flex-col items-center bg-slate-800/40 p-2.5 rounded-2xl border border-white/5">
                    <label class="text-xs text-slate-400 mb-1 font-medium">時</label>
                    <input type="number" id="inputHours" min="0" max="99" value="0" placeholder="00" class="w-full bg-transparent text-center font-mono text-xl md:text-2xl text-white focus:outline-none font-bold">
                </div>
                <div class="flex flex-col items-center bg-slate-800/40 p-2.5 rounded-2xl border border-white/5">
                    <label class="text-xs text-slate-400 mb-1 font-medium">分</label>
                    <input type="number" id="inputMinutes" min="0" max="59" value="5" placeholder="00" class="w-full bg-transparent text-center font-mono text-xl md:text-2xl text-white focus:outline-none font-bold">
                </div>
                <div class="flex flex-col items-center bg-slate-800/40 p-2.5 rounded-2xl border border-white/5">
                    <label class="text-xs text-slate-400 mb-1 font-medium">秒</label>
                    <input type="number" id="inputSeconds" min="0" max="59" value="0" placeholder="00" class="w-full bg-transparent text-center font-mono text-xl md:text-2xl text-white focus:outline-none font-bold">
                </div>
            </div>

            <!-- Timer Action Controls -->
            <div class="flex items-center gap-3 pt-2">
                <button id="btnTimerReset" onclick="resetTimer()" class="flex-1 py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-white/10 text-slate-300 font-semibold text-sm transition active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-left"></i> 重置
                </button>
                <button id="btnTimerStart" onclick="toggleTimer()" class="flex-[2] py-3.5 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold text-base shadow-lg shadow-cyan-500/20 transition active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play" id="iconTimerStart"></i> <span id="textTimerStart">開始</span>
                </button>
            </div>
        </div>

        <!-- ==================== STOPWATCH SECTION ==================== -->
        <div id="sectionStopwatch" class="space-y-6 hidden">
            
            <!-- Main Stopwatch Display -->
            <div class="py-10 text-center bg-slate-900/40 rounded-3xl border border-white/5 relative overflow-hidden">
                <div class="text-xs uppercase tracking-widest text-indigo-400 font-bold mb-2">碼表計時</div>
                <div id="stopwatchDisplay" class="font-mono text-4xl md:text-6xl font-extrabold tracking-tight text-white">
                    00:00<span class="text-2xl md:text-4xl text-indigo-400">.00</span>
                </div>
            </div>

            <!-- Stopwatch Controls -->
            <div class="flex items-center gap-3">
                <button id="btnStopwatchReset" onclick="resetStopwatch()" class="flex-1 py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-white/10 text-slate-300 font-semibold text-sm transition active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-left"></i> 重置
                </button>
                <button id="btnStopwatchLap" onclick="recordLap()" disabled class="flex-1 py-3.5 rounded-2xl bg-slate-800 border border-white/10 text-slate-500 font-semibold text-sm transition flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-flag"></i> 計圈
                </button>
                <button id="btnStopwatchStart" onclick="toggleStopwatch()" class="flex-[2] py-3.5 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 text-white font-bold text-base shadow-lg shadow-indigo-500/20 transition active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play" id="iconStopwatchStart"></i> <span id="textStopwatchStart">開始</span>
                </button>
            </div>

            <!-- Lap History List -->
            <div class="mt-4">
                <div class="flex justify-between items-center text-xs text-slate-400 font-semibold px-2 mb-2">
                    <span>圈數 (Lap)</span>
                    <span>分圈時間</span>
                    <span>總時間</span>
                </div>
                <div id="lapList" class="max-h-48 overflow-y-auto space-y-1.5 pr-1">
                    <div class="text-center py-6 text-slate-500 text-sm font-medium">
                        尚無計圈記錄
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ================= Global State & Utilities =================
        let activeTab = 'timer';

        function switchTab(tab) {
            activeTab = tab;
            const tabTimer = document.getElementById('tabTimer');
            const tabStopwatch = document.getElementById('tabStopwatch');
            const sectionTimer = document.getElementById('sectionTimer');
            const sectionStopwatch = document.getElementById('sectionStopwatch');

            if (tab === 'timer') {
                tabTimer.className = "flex-1 py-3 rounded-xl font-medium text-sm md:text-base flex items-center justify-center gap-2 transition-all duration-300 text-cyan-400 bg-slate-800/80 shadow-md";
                tabStopwatch.className = "flex-1 py-3 rounded-xl font-medium text-sm md:text-base flex items-center justify-center gap-2 transition-all duration-300 text-slate-400 hover:text-slate-200";
                sectionTimer.classList.remove('hidden');
                sectionStopwatch.classList.add('hidden');
            } else {
                tabStopwatch.className = "flex-1 py-3 rounded-xl font-medium text-sm md:text-base flex items-center justify-center gap-2 transition-all duration-300 text-indigo-400 bg-slate-800/80 shadow-md";
                tabTimer.className = "flex-1 py-3 rounded-xl font-medium text-sm md:text-base flex items-center justify-center gap-2 transition-all duration-300 text-slate-400 hover:text-slate-200";
                sectionStopwatch.classList.remove('hidden');
                sectionTimer.classList.add('hidden');
            }
        }

        // Web Audio API for Alarm Sound Synthesis
        let audioCtx = null;
        let alarmInterval = null;

        function playAlarmSound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            let beepCount = 0;
            alarmInterval = setInterval(() => {
                if (beepCount >= 6) {
                    stopAlarmSound();
                    return;
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 note
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
                beepCount++;
            }, 400);
        }

        function stopAlarmSound() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        // Pad single numbers with leading zeros
        const pad = (num, size = 2) => String(num).padStart(size, '0');

        // ================= COUNTDOWN TIMER LOGIC =================
        let timerInterval = null;
        let totalTimerSeconds = 300; // Default 5 mins
        let remainingSeconds = 300;
        let isTimerRunning = false;
        let timerEndTime = 0; // Epoch timestamp for precise sub-second calculation

        const timerDisplay = document.getElementById('timerDisplay');
        const timerPercentDisplay = document.getElementById('timerPercentDisplay');
        const timerProgressRing = document.getElementById('timerProgressRing');
        const btnTimerStart = document.getElementById('btnTimerStart');
        const iconTimerStart = document.getElementById('iconTimerStart');
        const textTimerStart = document.getElementById('textTimerStart');
        const mainContainer = document.getElementById('mainContainer');

        const inputH = document.getElementById('inputHours');
        const inputM = document.getElementById('inputMinutes');
        const inputS = document.getElementById('inputSeconds');

        // SVG Ring Circumference calculation
        const circumference = 2 * Math.PI * 121; // 42% radius in ~288px frame ≈ 121px radius
        timerProgressRing.style.strokeDasharray = circumference;

        function updateProgressRing(percent) {
            const offset = circumference - (percent / 100) * circumference;
            timerProgressRing.style.strokeDashoffset = offset;
        }

        function renderTimer() {
            // Calculate displaying seconds rounded up for standard clock behavior
            const displaySecs = Math.ceil(remainingSeconds);
            const h = Math.floor(displaySecs / 3600);
            const m = Math.floor((displaySecs % 3600) / 60);
            const s = displaySecs % 60;

            timerDisplay.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
            
            // Calculate percentage with 3 decimal places precision
            const percentRaw = totalTimerSeconds > 0 ? Math.max(0, (remainingSeconds / totalTimerSeconds) * 100) : 0;
            const percentFormatted = percentRaw.toFixed(3);
            
            timerPercentDisplay.textContent = `${percentFormatted}% 剩餘`;
            updateProgressRing(percentRaw);
        }

        function readInputsToTimer() {
            const h = parseInt(inputH.value) || 0;
            const m = parseInt(inputM.value) || 0;
            const s = parseInt(inputS.value) || 0;
            return (h * 3600) + (m * 60) + s;
        }

        function addMinutes(mins) {
            if (isTimerRunning) return;
            let currentTotal = readInputsToTimer();
            currentTotal += mins * 60;
            
            const h = Math.floor(currentTotal / 3600);
            const m = Math.floor((currentTotal % 3600) / 60);
            const s = currentTotal % 60;

            inputH.value = h;
            inputM.value = m;
            inputS.value = s;

            totalTimerSeconds = currentTotal;
            remainingSeconds = currentTotal;
            renderTimer();
        }

        function toggleTimer() {
            if (isTimerRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (!isTimerRunning) {
                if (remainingSeconds === 0 || remainingSeconds !== readInputsToTimer() && !timerInterval) {
                    totalTimerSeconds = readInputsToTimer();
                    remainingSeconds = totalTimerSeconds;
                }

                if (totalTimerSeconds <= 0) return;

                isTimerRunning = true;
                timerEndTime = Date.now() + remainingSeconds * 1000;

                iconTimerStart.className = "fa-solid fa-pause";
                textTimerStart.textContent = "暫停";
                btnTimerStart.className = "flex-[2] py-3.5 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-base shadow-lg shadow-amber-500/20 transition active:scale-95 flex items-center justify-center gap-2";

                document.getElementById('timerInputGroup').classList.add('opacity-40', 'pointer-events-none');
                mainContainer.classList.remove('glow-alarm');

                // High-frequency interval (30ms) for smooth decimal percentage rendering
                timerInterval = setInterval(() => {
                    const now = Date.now();
                    remainingSeconds = Math.max(0, (timerEndTime - now) / 1000);
                    
                    renderTimer();

                    if (remainingSeconds <= 0) {
                        // Timer Complete
                        clearInterval(timerInterval);
                        timerInterval = null;
                        isTimerRunning = false;
                        remainingSeconds = 0;
                        renderTimer();
                        playAlarmSound();
                        mainContainer.classList.add('glow-alarm');
                        resetTimerControls();
                    }
                }, 30);
            }
        }

        function pauseTimer() {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                timerInterval = null;
                isTimerRunning = false;
                iconTimerStart.className = "fa-solid fa-play";
                textTimerStart.textContent = "繼續";
                btnTimerStart.className = "flex-[2] py-3.5 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold text-base shadow-lg shadow-cyan-500/20 transition active:scale-95 flex items-center justify-center gap-2";
            }
        }

        function resetTimerControls() {
            iconTimerStart.className = "fa-solid fa-play";
            textTimerStart.textContent = "開始";
            btnTimerStart.className = "flex-[2] py-3.5 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold text-base shadow-lg shadow-cyan-500/20 transition active:scale-95 flex items-center justify-center gap-2";
            document.getElementById('timerInputGroup').classList.remove('opacity-40', 'pointer-events-none');
        }

        function resetTimer() {
            pauseTimer();
            stopAlarmSound();
            mainContainer.classList.remove('glow-alarm');
            resetTimerControls();
            
            totalTimerSeconds = readInputsToTimer();
            remainingSeconds = totalTimerSeconds;
            renderTimer();
        }

        // Input listeners for real-time updates
        [inputH, inputM, inputS].forEach(input => {
            input.addEventListener('input', () => {
                if (!isTimerRunning) {
                    totalTimerSeconds = readInputsToTimer();
                    remainingSeconds = totalTimerSeconds;
                    renderTimer();
                }
            });
        });

        // ================= STOPWATCH LOGIC =================
        let stopwatchInterval = null;
        let stopwatchStartTime = 0;
        let stopwatchElapsedTime = 0;
        let isStopwatchRunning = false;

        let laps = [];
        let lastLapTime = 0;

        const stopwatchDisplay = document.getElementById('stopwatchDisplay');
        const btnStopwatchStart = document.getElementById('btnStopwatchStart');
        const iconStopwatchStart = document.getElementById('iconStopwatchStart');
        textStopwatchStart = document.getElementById('textStopwatchStart');
        const btnStopwatchLap = document.getElementById('btnStopwatchLap');
        const lapList = document.getElementById('lapList');

        function formatStopwatchTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            const hundredths = Math.floor((ms % 1000) / 10);
            return `${pad(minutes)}:${pad(seconds)}<span class="text-2xl md:text-4xl text-indigo-400">.${pad(hundredths)}</span>`;
        }

        function formatStopwatchTimePlain(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            const hundredths = Math.floor((ms % 1000) / 10);
            return `${pad(minutes)}:${pad(seconds)}.${pad(hundredths)}`;
        }

        function toggleStopwatch() {
            if (isStopwatchRunning) {
                pauseStopwatch();
            } else {
                startStopwatch();
            }
        }

        function startStopwatch() {
            if (!isStopwatchRunning) {
                isStopwatchRunning = true;
                stopwatchStartTime = Date.now() - stopwatchElapsedTime;
                
                stopwatchInterval = setInterval(() => {
                    stopwatchElapsedTime = Date.now() - stopwatchStartTime;
                    stopwatchDisplay.innerHTML = formatStopwatchTime(stopwatchElapsedTime);
                }, 10);

                iconStopwatchStart.className = "fa-solid fa-pause";
                textStopwatchStart.textContent = "暫停";
                btnStopwatchStart.className = "flex-[2] py-3.5 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-base shadow-lg shadow-amber-500/20 transition active:scale-95 flex items-center justify-center gap-2";

                btnStopwatchLap.disabled = false;
                btnStopwatchLap.className = "flex-1 py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-white/10 text-indigo-300 font-semibold text-sm transition active:scale-95 flex items-center justify-center gap-2";
            }
        }

        function pauseStopwatch() {
            if (isStopwatchRunning) {
                clearInterval(stopwatchInterval);
                stopwatchInterval = null;
                isStopwatchRunning = false;

                iconStopwatchStart.className = "fa-solid fa-play";
                textStopwatchStart.textContent = "繼續";
                btnStopwatchStart.className = "flex-[2] py-3.5 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 text-white font-bold text-base shadow-lg shadow-indigo-500/20 transition active:scale-95 flex items-center justify-center gap-2";

                btnStopwatchLap.disabled = true;
                btnStopwatchLap.className = "flex-1 py-3.5 rounded-2xl bg-slate-800 border border-white/10 text-slate-500 font-semibold text-sm transition flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed";
            }
        }

        function resetStopwatch() {
            pauseStopwatch();
            stopwatchElapsedTime = 0;
            lastLapTime = 0;
            laps = [];
            stopwatchDisplay.innerHTML = `00:00<span class="text-2xl md:text-4xl text-indigo-400">.00</span>`;
            
            iconStopwatchStart.className = "fa-solid fa-play";
            textStopwatchStart.textContent = "開始";
            lapList.innerHTML = `<div class="text-center py-6 text-slate-500 text-sm font-medium">尚無計圈記錄</div>`;
        }

        function recordLap() {
            if (!isStopwatchRunning) return;

            const currentTotal = stopwatchElapsedTime;
            const lapDuration = currentTotal - lastLapTime;
            lastLapTime = currentTotal;

            laps.push({
                lapNum: laps.length + 1,
                lapDuration: lapDuration,
                totalTime: currentTotal
            });

            renderLaps();
        }

        function renderLaps() {
            if (laps.length === 0) return;

            let minDuration = Infinity;
            let maxDuration = -1;

            if (laps.length > 1) {
                laps.forEach(lap => {
                    if (lap.lapDuration < minDuration) minDuration = lap.lapDuration;
                    if (lap.lapDuration > maxDuration) maxDuration = lap.lapDuration;
                });
            }

            lapList.innerHTML = laps.slice().reverse().map(lap => {
                let badgeClass = "text-slate-300";
                let badgeLabel = "";

                if (laps.length > 1) {
                    if (lap.lapDuration === minDuration) {
                        badgeClass = "text-emerald-400 font-bold";
                        badgeLabel = `<span class="ml-1 text-[10px] bg-emerald-950/80 text-emerald-400 border border-emerald-500/30 px-1.5 py-0.5 rounded">最快</span>`;
                    } else if (lap.lapDuration === maxDuration) {
                        badgeClass = "text-rose-400 font-bold";
                        badgeLabel = `<span class="ml-1 text-[10px] bg-rose-950/80 text-rose-400 border border-rose-500/30 px-1.5 py-0.5 rounded">最慢</span>`;
                    }
                }

                return `
                    <div class="flex justify-between items-center bg-slate-800/40 px-3 py-2.5 rounded-xl border border-white/5 font-mono text-sm">
                        <span class="text-slate-400 font-sans font-medium">第 ${lap.lapNum} 圈</span>
                        <span class="${badgeClass} flex items-center">${formatStopwatchTimePlain(lap.lapDuration)} ${badgeLabel}</span>
                        <span class="text-slate-400">${formatStopwatchTimePlain(lap.totalTime)}</span>
                    </div>
                `;
            }).join('');
        }

        // Initialize Timer Display on Load
        renderTimer();
    </script>
</body>
</html>
